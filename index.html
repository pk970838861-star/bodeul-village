<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff8fab">
<title>보들마을</title>
<script src="/api/config"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: full-screen pixel village (canvas) with floating HUD — profile card top-left, menu row top-right, chat bottom-left; thick-outlined cream panels pop over it. Single daytime look on purpose. */
:root{
  --edge:#3b2a36; --ink:#3b2a36; --ink-soft:#86707f; --cream:#fffaf0; --white:#ffffff;
  --pink:#ff8fab; --pink-deep:#e0567e; --pink-pale:#ffe2ea; --yellow:#ffd36b; --green:#7dd38a; --green-pale:#e5f6d9;
  --lock:#ece6ee; --field-a:#b6e6b2; --field-b:#8fcd61; --dash:#f0dcbc; --ok:#2c9466; --bad:#cf3f58; --gold:#ffb52e;
  --shadow:rgba(59,42,54,.16);
  --f-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--field-b);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px}
img.px{image-rendering:pixelated}
.sub{margin:0;font-size:14px;color:var(--ink-soft);line-height:1.5}

/* ---------- start ---------- */
.screen{position:fixed;inset:0;overflow:auto;background:linear-gradient(160deg,var(--field-a),var(--field-b));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:grid;place-items:center}
.start-card{position:relative;width:100%;max-width:560px;background:var(--cream);border:4px solid var(--edge);border-radius:40px;box-shadow:0 10px 0 rgba(59,42,54,.25);padding:46px 30px 30px;display:flex;flex-direction:column;gap:18px}
.parade{position:absolute;top:-34px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.parade img{width:44px;height:60px;animation:hop 1.8s ease-in-out infinite}
.parade img:nth-child(2){animation-delay:-.3s}.parade img:nth-child(3){animation-delay:-.6s}.parade img:nth-child(4){animation-delay:-.9s}.parade img:nth-child(5){animation-delay:-1.2s}
@keyframes hop{50%{transform:translateY(-6px)}}
.logo{margin:0;text-align:center;font-family:var(--f-display);font-weight:400;font-size:clamp(48px,13vw,72px);line-height:1;color:var(--pink);text-shadow:0 6px 0 rgba(59,42,54,.13);letter-spacing:1px}
.tag{margin:-6px 0 4px;text-align:center;font-size:18px;color:var(--ink-soft)}
.opt{display:block;width:100%;text-align:left;border:4px solid var(--edge);border-radius:30px;padding:20px 24px;box-shadow:0 8px 0 rgba(59,42,54,.15);transition:transform .1s,box-shadow .1s}
.opt:hover{transform:translateY(-2px);box-shadow:0 10px 0 rgba(59,42,54,.15)}
.opt:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(59,42,54,.15)}
.opt.g{background:var(--green-pale)} .opt.m{background:var(--pink-pale)}
.opt .t{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:26px}
.opt .t svg{width:34px;height:34px}
.opt .d{display:block;margin-top:8px;font-size:16px;color:var(--ink-soft)}
.link{align-self:center;font-size:16px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;padding:6px}
.form{display:flex;flex-direction:column;gap:12px}
.form h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-soft)}
.field input{font:inherit;font-size:18px;color:var(--ink);padding:12px 14px;border:3px solid var(--edge);border-radius:16px;background:var(--white)}
.pin{letter-spacing:10px;font-family:var(--f-display)}
.err{min-height:20px;font-size:14px;color:var(--bad)}
.note{font-size:14px;line-height:1.55;background:var(--white);border:2px dashed var(--dash);border-radius:16px;padding:10px 14px;color:var(--ink-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}

/* chunky buttons */
.gbtn{display:block;width:100%;font-family:var(--f-display);font-size:19px;padding:11px 12px;border:4px solid var(--edge);border-radius:22px;box-shadow:0 6px 0 rgba(59,42,54,.16);background:var(--white);transition:transform .08s,box-shadow .08s;text-align:center}
.gbtn:active:not([disabled]){transform:translateY(3px);box-shadow:0 3px 0 rgba(59,42,54,.16)}
.gbtn.pink{background:var(--pink);color:#fff} .gbtn.yellow{background:var(--yellow)} .gbtn.green{background:var(--green)}
.gbtn[disabled],.gbtn.locked{background:var(--lock);color:var(--ink-soft);cursor:not-allowed}

/* ---------- game ---------- */
#game{position:fixed;inset:0;background:#5e9f4c}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:pointer}
.hud-top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.hud-top>*{pointer-events:auto}
.me-col{display:flex;flex-direction:column;gap:6px;align-items:flex-start;flex:none}
.card-me{display:flex;gap:10px;align-items:center;background:var(--cream);border:3px solid var(--edge);border-radius:18px;padding:7px 12px 7px 8px;box-shadow:0 5px 0 var(--shadow)}
.card-me img{width:36px;height:48px;flex:none}
.card-me .l1{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:16px}
.lvb{background:var(--gold);color:#fff;border-radius:8px;padding:1px 6px;font-size:13px}
.kind{font-family:var(--f-body);font-size:11px;border-radius:7px;padding:1px 6px;background:var(--green-pale);color:var(--ok)}
.kind.mem{background:var(--pink-pale);color:var(--pink-deep)}
.card-me .l2{font-size:12px;color:var(--pink-deep)}
.card-me .l3{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
.dot{width:9px;height:9px;border-radius:50%;background:#3fc46a;box-shadow:0 0 0 2px #c9f2d4}
.xpbar{height:5px;width:120px;background:var(--lock);border-radius:9px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:6px;background:var(--cream);border:3px solid var(--edge);border-radius:999px;padding:3px 12px 3px 6px;font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 var(--shadow)}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4 0 20%,#ffc93c 21% 68%,#e09a1f 69%);flex:none}
.menu{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;min-width:0}
.mbtn{width:72px;height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--cream);border:4px solid var(--edge);border-radius:22px;box-shadow:0 6px 0 var(--shadow);font-family:var(--f-display);font-size:14px;transition:transform .08s}
.mbtn svg{width:30px;height:30px}
.mbtn:active{transform:translateY(3px)}
.mbtn.exit{background:var(--pink-pale)}
.mbtn.off svg{opacity:.4}
.hud-bot{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:10px;pointer-events:none}
.hud-bot>*{pointer-events:auto}
.chatwrap{flex:0 1 560px;min-width:0;display:flex;flex-direction:column;gap:6px}
.log{display:flex;flex-direction:column;gap:3px;align-items:flex-start;pointer-events:none}
.log div{max-width:100%;background:rgba(59,42,54,.62);color:#fff;font-size:13px;border-radius:10px;padding:3px 9px;overflow-wrap:anywhere;animation:fadeLog 12s forwards}
.log b{color:#ffe08a;font-weight:400;font-family:var(--f-display)}
@keyframes fadeLog{85%{opacity:1}100%{opacity:0}}
.chatrow{display:flex;gap:8px;align-items:center;min-width:0}
.chatrow form{flex:1;min-width:120px;display:flex}
.chatrow input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border:3px solid var(--edge);border-radius:16px;background:var(--cream);color:var(--ink);box-shadow:0 5px 0 var(--shadow)}
.emo{width:48px;height:48px;flex:none;font-size:22px;background:var(--cream);border:3px solid var(--edge);border-radius:14px;box-shadow:0 5px 0 var(--shadow)}
.abtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:50%;background:var(--pink);color:#fff;border:4px solid var(--edge);box-shadow:0 6px 0 var(--shadow);font-family:var(--f-display);font-size:15px;line-height:1.15;padding:6px}
.toast{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:var(--edge);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;max-width:calc(100% - 32px);text-align:center;animation:drop .3s ease-out;pointer-events:none}
@keyframes drop{from{transform:translate(-50%,-14px);opacity:0}}
@media (max-width:820px){
  .hud-top{flex-direction:column;gap:8px}
  .menu{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;max-width:100%;padding-bottom:8px;gap:7px}
  .mbtn{width:56px;height:56px;border-radius:17px;border-width:3px;font-size:12px;flex:none}
  .mbtn svg{width:24px;height:24px}
  .emo.x{display:none}
  .toast{top:calc(170px + env(safe-area-inset-top,0px))}
}

/* ---------- panels ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(59,42,54,.38);display:grid;place-items:center;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.panel{width:100%;max-width:780px;max-height:100%;display:flex;flex-direction:column;background:var(--cream);border:4px solid var(--edge);border-radius:30px;box-shadow:0 10px 0 rgba(59,42,54,.25);overflow:hidden;animation:pop .22s ease-out}
.panel.narrow{max-width:520px}
@keyframes pop{from{transform:scale(.94);opacity:.4}}
.phead{display:flex;align-items:center;gap:10px;padding:14px 16px 12px 20px;border-bottom:3px dashed var(--dash)}
.phead svg{width:30px;height:30px;flex:none}
.phead h2{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;text-wrap:balance}
.xbtn{width:42px;height:42px;border:3px solid var(--edge);border-radius:14px;background:var(--white);font-size:22px;line-height:1;flex:none}
.pbody{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.sect{margin:4px 0 0;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:400;font-size:22px}
.sect svg{width:26px;height:26px}

.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.gcard{background:var(--white);border:4px solid var(--edge);border-radius:26px;box-shadow:0 8px 0 rgba(59,42,54,.12);padding:18px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.gcard>svg{width:56px;height:56px}
.gcard h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px}
.gcard p{margin:0 0 4px;font-size:15px;color:var(--ink-soft);line-height:1.55;flex:1}
.gcard .stack{width:100%;display:flex;flex-direction:column;gap:6px}
.rooms{display:flex;flex-direction:column;gap:8px;border:3px dashed var(--dash);border-radius:20px;padding:14px;min-height:64px}
.roomrow{display:flex;align-items:center;gap:10px;background:var(--white);border:3px solid var(--edge);border-radius:16px;padding:8px 8px 8px 14px}
.roomrow span{flex:1;min-width:0;overflow-wrap:anywhere}
.roomrow .gbtn{width:auto;padding:6px 14px;font-size:16px;border-width:3px}

/* quiz */
.qhead{display:flex;gap:12px;align-items:flex-end}
.qhead img{width:60px;height:82px;flex:none}
.bubble{flex:1;min-width:0;background:var(--white);border:3px solid var(--edge);border-radius:18px 18px 18px 4px;padding:10px 14px;font-size:16px;line-height:1.5}
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft)}
.dots{display:flex;gap:6px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--lock);border:2px solid var(--edge)}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--pink)}
.qtext{font-family:var(--f-display);font-size:22px;line-height:1.45;text-wrap:balance}
.opts{display:grid;gap:8px}
.ans{text-align:left;padding:12px 14px;border-radius:16px;border:3px solid var(--edge);background:var(--white);font-size:16px;line-height:1.4;display:flex;gap:10px;align-items:center;box-shadow:0 4px 0 var(--shadow)}
.ans .k{flex:none;width:26px;height:26px;border-radius:50%;background:var(--lock);display:grid;place-items:center;font-family:var(--f-display);font-size:14px}
.ans.ok{background:#dcf4e7} .ans.ok .k{background:var(--ok);color:#fff}
.ans.no{background:#fde2e7} .ans.no .k{background:var(--bad);color:#fff}
.ans[disabled]{cursor:default}
.explain{border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.6;border:3px solid var(--edge)}
.explain.ok{background:#dcf4e7} .explain.no{background:#fde2e7}
.explain strong{display:block;font-family:var(--f-display);font-weight:400;font-size:17px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.big{font-family:var(--f-display);font-size:48px;line-height:1;color:var(--pink-deep);font-variant-numeric:tabular-nums}

/* wardrobe */
.ward{display:grid;grid-template-columns:180px 1fr;gap:18px}
@media (max-width:560px){.ward{grid-template-columns:1fr}}
.preview{background:var(--green-pale);border:3px solid var(--edge);border-radius:22px;display:grid;place-items:center;padding:14px}
.preview img{width:96px;height:132px}
.swrow{display:flex;flex-direction:column;gap:6px}
.swrow b{font-family:var(--f-display);font-weight:400;font-size:16px}
.sws{display:flex;gap:7px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:11px;border:3px solid var(--edge)}
.sw.on{box-shadow:0 0 0 3px var(--cream),0 0 0 6px var(--pink-deep)}
.hats{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.hat{border:3px solid var(--edge);border-radius:16px;background:var(--white);padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px}
.hat img{width:40px;height:55px}
.hat.on{background:var(--pink-pale)}
.hat .pr{display:flex;align-items:center;gap:4px;font-family:var(--f-display)}
.hat .pr .coin{width:14px;height:14px}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:12px;background:var(--white);border:3px solid var(--edge);border-radius:18px;padding:10px 12px}
.li img{width:32px;height:44px;flex:none}
.li .grow{flex:1;min-width:0}
.li .nm{font-family:var(--f-display);font-size:17px;overflow-wrap:anywhere}
.li .ds{font-size:13px;color:var(--ink-soft)}
.li .gbtn{width:auto;padding:7px 14px;font-size:15px;border-width:3px;flex:none}
.prog{height:12px;background:var(--lock);border:2px solid var(--edge);border-radius:10px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--green)}
.hearts{display:flex;gap:2px;margin-top:3px}
.hearts svg{width:14px;height:14px}
.mapwrap{border:4px solid var(--edge);border-radius:20px;overflow:hidden;background:#5e9f4c}
.mapwrap canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:2px solid var(--edge)}
.help{display:grid;gap:10px}
.help div{background:var(--white);border:3px solid var(--edge);border-radius:16px;padding:10px 14px;line-height:1.6}
.help b{font-family:var(--f-display);font-weight:400;font-size:17px}
kbd{font-family:var(--f-display);background:var(--lock);border:2px solid var(--edge);border-radius:7px;padding:0 6px;font-size:13px}

/* games */
.ghud{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stair-cv{display:block;margin:0 auto;width:100%;max-width:340px;aspect-ratio:320/380;border:4px solid var(--edge);border-radius:20px;image-rendering:pixelated;background:#bfe6ff}
.vs{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-display);font-size:18px;flex-wrap:wrap}
.vs .sc{font-size:34px;color:var(--pink-deep)}
.hands{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hands .gbtn{font-size:30px;padding:14px 4px}
.hands .gbtn small{display:block;font-size:14px}
.hands .gbtn.on{background:var(--yellow)}
.reveal{display:flex;justify-content:center;gap:28px;font-size:54px;min-height:70px;align-items:center}
.reveal span{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--ink-soft)}
.reveal span b{font-size:54px;line-height:1.1;font-weight:400}
.omok{display:grid;grid-template-columns:repeat(13,1fr);width:100%;max-width:480px;margin:0 auto;aspect-ratio:1;background:#e7b56e;border:4px solid var(--edge);border-radius:18px;padding:3%}
.omok button{position:relative;aspect-ratio:1}
.omok button::before{content:"";position:absolute;inset:0;background:linear-gradient(#8a5a33,#8a5a33) center/100% 1.5px no-repeat,linear-gradient(#8a5a33,#8a5a33) center/1.5px 100% no-repeat}
.omok button:hover:not([disabled])::after{content:"";position:absolute;inset:14%;border-radius:50%;background:rgba(59,42,54,.18)}
.omok .st{position:absolute;inset:8%;border-radius:50%;z-index:1}
.omok .b{background:radial-gradient(circle at 35% 30%,#6c6470,#1d1820 70%)}
.omok .w{background:radial-gradient(circle at 35% 30%,#fff,#ddd6dc 75%);box-shadow:inset 0 0 0 1px #b8aeb6}
.omok .last::after{content:"";position:absolute;inset:38%;border-radius:50%;background:var(--pink)}
.typing-target{font-family:var(--f-display);font-size:24px;line-height:1.5;background:var(--white);border:3px solid var(--edge);border-radius:18px;padding:14px 16px;overflow-wrap:anywhere}
.typing-target .c{color:var(--ok)} .typing-target .w{color:var(--bad);text-decoration:underline} .typing-target .r{color:var(--ink-soft)}
.typing-in{font:inherit;font-size:20px;padding:12px 14px;border:3px solid var(--edge);border-radius:16px;width:100%;background:var(--white);color:var(--ink)}

.vb-cv{display:block;width:100%;max-width:640px;margin:0 auto;aspect-ratio:480/300;border:4px solid var(--edge);border-radius:20px;background:#bfe6ff;touch-action:none}
.vpad{display:grid;grid-template-columns:1fr 1fr 1.3fr 1.6fr;gap:8px;max-width:640px;width:100%;margin:0 auto}
.vpad .gbtn{padding:14px 4px;touch-action:none;-webkit-user-select:none;user-select:none}
.rain-cv{display:block;width:100%;max-width:560px;margin:0 auto;aspect-ratio:480/340;border:4px solid var(--edge);border-radius:20px;background:#bfe6ff}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{background:var(--white);border:2px solid var(--edge);border-radius:999px;padding:4px 10px;font-size:14px}
.chip b{font-family:var(--f-display);font-weight:400;color:var(--pink-deep);margin-right:5px}
.lvdots{display:flex;flex-wrap:wrap;gap:6px}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------- 서버 연결 — 회원: 구글 스프레드시트(/api/sheet), 함께 놀기: Supabase Realtime(선택) ---------- */
const CFG = window.BODEUL_CONFIG || {};
let sb = null;
try { if (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase) sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:false}, realtime:{params:{eventsPerSecond:20}}}); } catch(e){ sb = null; }
const API = {
  ok: !!CFG.sheets,
  async call(o){
    const r = await fetch('/api/sheet', {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(o)});
    let d = null; try { d = await r.json(); } catch(e){}
    if (!d) throw {code:'http', message:'http'};
    if (d.error) throw {code:d.error, message:d.error};
    return d;
  },
  login(id, ph){ return API.call({action:'login', id, pinHash:ph}); },
  body(){ return {action:'save', id:who.id, nick:S.nick, pinHash:who.pinHash, state:S}; },
  async save(){ const d = await API.call(API.body()); if (d.status !== 'ok') throw {code:d.status}; },
  beacon(){ try { navigator.sendBeacon('/api/sheet', new Blob([JSON.stringify(API.body())], {type:'text/plain;charset=utf-8'})); } catch(e){} },
  async teacherList(code){ const d = await API.call({action:'teacherList', code}); return d.rows || []; },
  teacherDelete(code, id){ return API.call({action:'teacherDelete', code, id}); },

const TOPICS = ['chat','emote','move','again'];
function makeRoom(sb){
  const myId = Math.random().toString(36).slice(2, 12);
  function chan(name){
    const ch = sb.channel('bodeul-' + name, {config:{presence:{key:myId}, broadcast:{self:false}}});
    let peersArr = Object.freeze([]), peerHandlers = [], topicHandlers = {}, connected = false, pending = false, lastTrack = 0, trackTimer = null, mine = {};
    const build = () => {
      const ps = ch.presenceState(), old = new Map(peersArr.map(p => [p.peer, p])), arr = [];
      for (const [k, metas] of Object.entries(ps)) {
        const m = metas[metas.length - 1] || {}; const pres = {}; for (const [kk, v] of Object.entries(m)) if (kk !== 'presence_ref') pres[kk] = v;
        const prev = old.get(k), same = prev && JSON.stringify(prev.presence) === JSON.stringify(pres);
        arr.push(same ? prev : Object.freeze({peer:k, sameTab:k === myId, isMe:k === myId, kind:'viewer', guest:false, by:null, presence:Object.freeze(pres), updatedAt:Date.now()}));
      }
      const now = new Set(arr.map(p => p.peer));
      const change = {joined:arr.filter(p => !old.has(p.peer)), left:peersArr.filter(p => !now.has(p.peer)), updated:arr.filter(p => old.has(p.peer) && old.get(p.peer) !== p)};
      peersArr = Object.freeze(arr); change.peers = peersArr;
      peerHandlers.forEach(h => { try { h(change); } catch(e){} });
    };
    ch.on('presence', {event:'sync'}, build);
    TOPICS.forEach(t => ch.on('broadcast', {event:t}, ({payload}) => {
      const hs = topicHandlers[t]; if (!hs || !payload) return;
      const msg = {topic:t, data:payload.d, peer:String(payload.f || ''), sameTab:false, isMe:false, kind:'viewer', by:null, guest:false};
      hs.forEach(h => { try { h(msg); } catch(e){} });
    }));
    const doTrack = () => { lastTrack = Date.now(); trackTimer = null; pending = false; ch.track({...mine}).catch(() => {}); };
    const ready = new Promise(res => ch.subscribe(st => {
      if (st === 'SUBSCRIBED') { connected = true; res(true); if (pending) doTrack(); }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') { connected = false; res(false); }
    }));
    return {
      name, ready,
      presence(patch){ for (const [k, v] of Object.entries(patch)) { if (v === null) delete mine[k]; else mine[k] = v; } pending = true;
        if (connected) { const wait = 300 - (Date.now() - lastTrack); if (wait <= 0) doTrack(); else if (!trackTimer) trackTimer = setTimeout(doTrack, wait); }
        return Promise.resolve(); },
      emit(topic, data){ if (!connected) return Promise.resolve(); return ch.send({type:'broadcast', event:topic, payload:{f:myId, d:data}}).then(() => {}, () => {}); },
      on(topic, fn){ (topicHandlers[topic] = topicHandlers[topic] || []).push(fn); return () => { topicHandlers[topic] = topicHandlers[topic].filter(h => h !== fn); }; },
      onPeers(fn){ peerHandlers.push(fn); setTimeout(() => fn({peers:peersArr, joined:peersArr, left:[], updated:[]}), 0); return () => { peerHandlers = peerHandlers.filter(h => h !== fn); }; },
      peers(){ return peersArr; },
      connected(){ return connected; },
      leave(){ clearTimeout(trackTimer); peerHandlers = []; topicHandlers = {}; return sb.removeChannel(ch).then(() => {}, () => {}); },
    };
  }

  lobby.join = async name => {
    const r = chan('g-' + name);
    const ok = await Promise.race([r.ready, new Promise(res => setTimeout(() => res(false), 10000))]);
    if (!ok) { r.leave(); throw {code:'upstream_error'}; }
    return r;
  };
  return lobby;
}

function pix(rows, pal){

  rows.forEach((row,y) => [...row].forEach((ch,x) => { if (pal[ch]) out += `<rect x="${x}" y="${y}" width="1.04" height="1.04" fill="${pal[ch]}"/>`; }));
  return `<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${out}</svg>`;
}

function save(){

  if (who.kind === 'guest'){ try { localStorage.setItem(GUEST_KEY, JSON.stringify(S)); } catch(e){} return; }

  clearTimeout(saveT); saveT = null; lastFlush = Date.now();

  try { await API.save(); setSync('저장됨'); }
  catch(e){ if (e && e.code === 'wrong') { saveBlocked = true; setSync('저장 안 됨'); toast('비밀번호가 맞지 않아 저장하지 못했어요. 나갔다가 다시 로그인해 주세요.'); } else { dirty = true; setSync('다시 저장 시도'); } }

const msProg = k => k === 't' ? S.ms.t.length : (S.ms[k]||0);

  if (l > S.lv){ S.lv = l; S.coins += 20; toast(`레벨 업! Lv.${l} «${TITLES[l-1]}» · 동전 +20`); sendPresence(true); }

function spawnCoin(){

    const x = 3 + Math.floor(Math.random()*(MW-6)), y = 3 + Math.floor(Math.random()*(MH-6));
    if (B[ix(x,y)] || G[ix(x,y)] === 2) continue;

const typing = () => document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
addEventListener('keydown', e => {
  if ($('game').hidden) return;
  if (modalOpen()) { if (e.key === 'Escape') closePanel(); return; }
  if (typing()) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (e.key === 'Enter') { e.preventDefault(); $('chatIn').focus(); return; }
  if (e.key === ' ') { e.preventDefault(); if (near) near.act(); return; }
  const k = e.key.toLowerCase(); if (['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)) { e.preventDefault(); keys.add(k); target = null; pendingAct = null; }

addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

  if (modalOpen()) return; if (typing()) document.activeElement.blur();
  const r = cv.getBoundingClientRect(), wx = cam.x + (e.clientX - r.left) * dpr / ds, wy = cam.y + (e.clientY - r.top) * dpr / ds;
  let hit = null;
  for (const n of npcs) if (Math.abs(n.x - wx) < 10 && wy > n.y - 24 && wy < n.y + 4) hit = {x:n.x, y:n.y+8, act:() => talkNPC(n)};
  for (const s of SPOTS) if (Math.hypot(s.x - wx, s.y - wy) < 18) hit = s;

});
$('abtn').onclick = () => { if (near) near.act(); };

/* ---------- 루프 ---------- */
const cam = {x:0, y:0};
function resize(){ dpr = Math.min(2, devicePixelRatio || 1); cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr);
  ds = Math.max(2, Math.round(Math.min(cv.width, cv.height) / (isTouch ? 170 : 200))); }
addEventListener('resize', resize);
function loop(t){
  if (!running) return;
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  if (!$('game').hidden) { update(dt, t); draw(t); }
  requestAnimationFrame(loop);
}
function stepToward(ent, dx, dy, sp, dt){
  const len = Math.hypot(dx, dy); if (!len) return false;
  const vx = dx/len*sp*dt, vy = dy/len*sp*dt; let moved = false;
  if (canStand(ent.x + vx, ent.y)) { ent.x += vx; moved = true; }
  if (canStand(ent.x, ent.y + vy)) { ent.y += vy; moved = true; }
  ent.d = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
  return moved;
}
let stuck = 0, lastPres = 0, lastSaveMove = 0;
function update(dt, t){
  let dx = 0, dy = 0;
  if (!modalOpen() && !typing()){
    if (keys.has('arrowleft') || keys.has('a')) dx--; if (keys.has('arrowright') || keys.has('d')) dx++;
    if (keys.has('arrowup') || keys.has('w')) dy--; if (keys.has('arrowdown') || keys.has('s')) dy++;
  }
  if (!dx && !dy && target && !modalOpen()){
    const tx = target.x - me.x, ty = target.y - me.y;
    if (Math.hypot(tx,ty) < (pendingAct ? 14 : 2)) { target = null; if (pendingAct) { const a = pendingAct; pendingAct = null; a.act(); } }
    else { dx = tx; dy = ty; }
  }
  me.mv = false;
  if (dx || dy) {
    const ox = me.x, oy = me.y; stepToward(me, dx, dy, 74, dt); me.mv = Math.hypot(me.x-ox, me.y-oy) > .01;
    if (target && !me.mv) { stuck += dt; if (stuck > .4) { target = null; pendingAct = null; stuck = 0; } } else stuck = 0;
  }
  if (me.mv) { me.ft += dt; me.fr = [0,1,0,2][Math.floor(me.ft*8)%4]; } else { me.fr = 0; me.ft = 0; }
  // coins
  for (const c of coins) { if (c.gone) continue; if (Math.hypot(c.x - me.x, c.y - (me.y-4)) < 10) { c.gone = 1; S.coins++; bump('c'); addXP(1); save(); setTimeout(() => { coins = coins.filter(k => k !== c); spawnCoin(); }, 15000); } }
  // npcs
  for (const n of npcs){
    if (n.tx == null) { n.wait -= dt; n.fr = 0; if (n.wait <= 0) { const a = Math.random()*Math.PI*2, r = 6 + Math.random()*18; const tx = n.home[0]*T+8 + Math.cos(a)*r, ty = n.home[1]*T+12 + Math.sin(a)*r; if (canStand(tx,ty)) { n.tx = tx; n.ty = ty; } else n.wait = .5; } }
    else { const ddx = n.tx - n.x, ddy = n.ty - n.y; if (Math.hypot(ddx,ddy) < 1.5 || !stepToward(n, ddx, ddy, 24, dt)) { n.tx = null; n.wait = 2 + Math.random()*4; n.d = 'down'; } else { n.ft += dt; n.fr = [0,1,0,2][Math.floor(n.ft*6)%4]; } }
  }
  // others
  for (const o of others.values()){ const k = Math.min(1, dt*10); o.x += (o.tx - o.x)*k; o.y += (o.ty - o.y)*k; if (o.m) { o.ft += dt; o.fr = [0,1,0,2][Math.floor(o.ft*8)%4]; } else o.fr = 0; }
  // nearest interactable
  near = null; let best = 22;
  for (const n of npcs){ const d = Math.hypot(n.x - me.x, n.y - me.y); if (d < best) { best = d; near = {label:`${n.name}에게 말 걸기`, act:() => talkNPC(n)}; } }
  for (const s of SPOTS){ const d = Math.hypot(s.x - me.x, s.y - me.y); if (d < best) { best = d; near = s; } }
  const ab = $('abtn'); const show = !!near && !modalOpen() && isTouch; if (ab.hidden === show) ab.hidden = !show; if (show && ab.textContent !== near.label) ab.textContent = near.label;
  if (t - lastPres > 100) { lastPres = t; sendPresence(false); }
  if (me.mv && t - lastSaveMove > 10000) { lastSaveMove = t; save(); }
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function label(text, sx, sy, size, color){ ctx.font = `${Math.round(size*dpr)}px Jua, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round'; ctx.lineWidth = 3.5*dpr; ctx.strokeStyle = E; ctx.strokeText(text, sx, sy); ctx.fillStyle = color; ctx.fillText(text, sx, sy); }

}
function draw(t){
  const W = cv.width, H = cv.height, vw = W/ds, vh = H/ds;
  cam.x = MW*T <= vw ? (MW*T - vw)/2 : clamp(me.x - vw/2, 0, MW*T - vw);
  cam.y = MH*T <= vh ? (MH*T - vh)/2 : clamp(me.y - 10 - vh/2, 0, MH*T - vh);
  cam.x = Math.round(cam.x*ds)/ds; cam.y = Math.round(cam.y*ds)/ds;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#5e9f4c'; ctx.fillRect(0,0,W,H);
  ctx.drawImage(ground, Math.round(-cam.x*ds), Math.round(-cam.y*ds), MW*T*ds, MH*T*ds);

  ctx.fillStyle = 'rgba(255,255,255,.55)';
  for (let y = ty0; y <= ty1; y++) for (let x = tx0; x <= tx1; x++) if (G[ix(x,y)] === 2) { const ph = ((t/90 + x*5 + y*11) % 32); if (ph < 16) ctx.fillRect(sx(x*T + 4 + (ph%8)), sy(y*T + ((x*7+y*3)%12) + 2), 4*ds, ds); }

  for (const [p,o] of others) L.push({k:2, by:o.y, e:o, lk:o.lk, top:`Lv.${o.lv} ${TITLES[(o.lv||1)-1]}`, name:o.n, key:p});
  L.push({k:2, by:me.y, e:me, lk:S.look, top:`Lv.${S.lv} ${TITLES[S.lv-1]}`, name:S.nick, key:'me', self:true});
  L.sort((a,b) => a.by - b.by);
  const labels = [];
  for (const d of L){
    if (d.k === 0) ctx.drawImage(d.o.spr, sx(d.o.px), sy(d.o.py), d.o.spr.width*ds, d.o.spr.height*ds);
    else if (d.k === 1) { const f = SPR.coin[Math.floor(t/120 + d.c.ph) % 4], bob = Math.sin(t/300 + d.c.ph)*1.5; ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(sx(d.c.x-3), sy(d.c.y+5), 6*ds, 2*ds); ctx.drawImage(f, sx(d.c.x-5), sy(d.c.y-5+bob), 10*ds, 10*ds); }

      ctx.drawImage(charSpr(d.lk, e.d||'down', e.fr||0), sx(e.x-8), sy(e.y-22), 16*ds, 22*ds); labels.push(d); }
  }
  for (const o of OBJ) if (o.label && o.lx > cam.x-60 && o.lx < cam.x+vw+60) label(o.label, sx(o.lx), sy(o.ly), 14, '#fff6c9');
  for (const d of labels){
    const e = d.e, x = sx(e.x), top = sy(e.y-22) - 4*dpr;
    label(d.name || '', x, top, 13, d.self ? '#ffe08a' : d.npc ? '#ffffff' : '#d8f0ff');
    label(d.top, x, top - 16*dpr, 10.5, d.npc ? '#ffd0dc' : '#fff6c9');
    let headY = top - 30*dpr;
    if (d.npc) { const left = (S.cool[e.id]||0) - Date.now(); const ready = left <= 0; const bx = x + 26*dpr, by = sy(e.y-22) - 6*dpr + Math.sin(t/250)*2*dpr*(ready?1:0);
      ctx.fillStyle = ready ? '#ff5c7a' : '#b9aab4'; ctx.strokeStyle = E; ctx.lineWidth = 2*dpr; ctx.beginPath(); ctx.arc(bx, by, 9*dpr, 0, Math.PI*2); ctx.fill(); ctx.stroke();

let lobby = null, roomSetup = false, lastSent = '';
async function setupRoom(){
  if (roomSetup) return; roomSetup = true;
  const room = await roomP; if (!room) { renderOnline(); return; }
  lobby = room;
  room.onPeers(ch => {
    for (const p of ch.left) { others.delete(p.peer); bubbles.delete(p.peer); }
    for (const p of ch.peers){
      if (p.sameTab) continue; const pr = p.presence || {};
      if (typeof pr.x !== 'number' || typeof pr.y !== 'number') { others.delete(p.peer); continue; }
      const o = others.get(p.peer) || {x:pr.x, y:pr.y, fr:0, ft:0};
      Object.assign(o, {tx:pr.x, ty:pr.y, d:['up','down','left','right'].includes(pr.d)?pr.d:'down', m:!!pr.m, n:String(pr.n||'주민').slice(0,10), lv:clamp(+pr.lv||1,1,LV.length), lk:safeLook(pr.lk), hz:pr.hz});
      others.set(p.peer, o);
    }
    renderOnline(); if (arcadeOpen) renderRooms();
  });
  room.on('chat', m => { if (m.sameTab) return; const t = clean(String(m.data && m.data.t || '')).slice(0,60); if (!t) return; const o = others.get(m.peer); bubbles.set(m.peer, {text:t, until:Date.now()+5000}); logLine(o ? o.n : '주민', t); });
  room.on('emote', m => { if (m.sameTab) return; const e = String(m.data && m.data.e || ''); if (!['👋','❤️','😆','✨','💯'].includes(e)) return; bubbles.set(m.peer, {text:e, emoji:true, until:Date.now()+3000}); });
}
function safeLook(l){ l = l || {}; const n = (v,max) => clamp(Math.floor(+v||0),0,max-1); return {s:n(l.s,SKIN.length), h:n(l.h,HAIR.length), sh:n(l.sh,SHIRT.length), p:n(l.p,PANTS.length), hat:n(l.hat,HATS.length)}; }
function sendPresence(force){
  if (!lobby || !me || $('game').hidden) return;
  const pr = {n:S.nick, x:Math.round(me.x), y:Math.round(me.y), d:me.d, m:me.mv, lv:S.lv, lk:S.look};
  const sig = JSON.stringify(pr); if (!force && sig === lastSent) return; lastSent = sig;
  lobby.presence(pr).catch(() => {});
}
function renderOnline(){ const n = 1 + [...others.values()].length; $('online').textContent = `접속 ${n}명`; }
function logLine(name, text){ const d = document.createElement('div'); const b = document.createElement('b'); b.textContent = name + ' '; d.appendChild(b); d.appendChild(document.createTextNode(text)); const log = $('log'); log.appendChild(d); while (log.children.length > 5) log.firstChild.remove(); setTimeout(() => d.remove(), 12000); }
function sendChat(t){

  if (lobby) lobby.emit('chat', {t}).catch(e => { if (e && e.code === 'not_permitted') toast('채팅을 보내지 못했어요.'); });
}
function sendEmote(e){

let actx = null, musicOn = false, musicTimer = null, step = 0, nextT = 0;
const MEL = [76,79,81,79,76,74,72,74,76,79,81,84,83,81,79,0,77,81,84,81,79,76,74,76,72,74,76,79,76,74,72,0];
const BASS = [48,43,45,41];
const hz = m => 440 * Math.pow(2, (m-69)/12);
function note(f, at, dur, type, vol){ const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at+.01); g.gain.exponentialRampToValueAtTime(.0001, at+dur); o.connect(g).connect(actx.destination); o.start(at); o.stop(at+dur+.02); }
function toggleMusic(){
  if (musicOn) { stopMusic(); return; }
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch(e){ toast('이 기기에서는 음악을 틀 수 없어요'); return; }
  musicOn = true; $('musicBtn').classList.remove('off'); nextT = actx.currentTime + .05; step = 0;
  musicTimer = setInterval(() => { while (nextT < actx.currentTime + .25) { const e = .27; const m = MEL[step % 32]; if (m) note(hz(m), nextT, e*.9, 'square', .035); if (step % 2 === 0) note(hz(BASS[Math.floor(step/8)%4]), nextT, e*1.6, 'triangle', .06); nextT += e; step++; } }, 60);
  toast('음악을 켰어요');
}
function stopMusic(){ musicOn = false; clearInterval(musicTimer); const b = $('musicBtn'); if (b) b.classList.add('off'); }

/* ---------- 무한의 계단 ---------- */
function stairsGame(N){
  let raf = 0;
  const onKey = e => { if (e.key === 'ArrowLeft') { e.preventDefault(); climb(-1); } if (e.key === 'ArrowRight') { e.preventDefault(); climb(1); } };
  const body = openPanel(`무한의 계단 · ${N}계단`, IC.stairs, {narrow:true, onClose:() => { cancelAnimationFrame(raf); removeEventListener('keydown', onKey); }});
  const steps = [0]; for (let i = 1; i <= N + 12; i++){ const p = steps[i-1]; let d = Math.random() < .5 ? -1 : 1; if (p + d > 3 || p + d < -3) d = -d; if (i > 1 && Math.random() < .55) d = steps[i-1] - steps[i-2]; if (p + d > 3 || p + d < -3) d = -d; steps.push(p + d); }
  let i = 0, face = steps[1] - steps[0], t0 = 0, el = 0, state = 'ready', fallY = 0;
  body.innerHTML = `<div class="ghud"><span id="stN">0 / ${N}</span><span id="stT">0.0초</span></div>
    <canvas class="stair-cv" id="stc" width="320" height="380"></canvas>
    <div class="row"><button class="gbtn yellow" id="stTurn">방향 바꾸기</button><button class="gbtn pink" id="stUp">오르기</button></div>
    <p class="sub">계단이 이어지는 쪽으로 올라요. 방향이 바뀌면 «방향 바꾸기»! PC는 ← → 키로 그 방향 계단을 바로 올라요. 틀리면 떨어져요.</p>`;
  const c = $('stc'), g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  $('stTurn').onclick = () => climb(-face); $('stUp').onclick = () => climb(face);
  addEventListener('keydown', onKey);
  function climb(dir){
    if (state === 'dead' || state === 'done') return;
    if (state === 'ready') { state = 'run'; t0 = performance.now(); }
    if (steps[i+1] - steps[i] === dir) { i++; face = dir; if (i >= N) finish(); }
    else { face = dir; state = 'dead'; el = (performance.now() - t0)/1000; gameDone(false); setTimeout(() => result(false), 700); }
  }
  function finish(){ state = 'done'; el = (performance.now() - t0)/1000; const best = S.stairs.best[N];
    if (!best || el < best) S.stairs.best[N] = el; let unlock = '';
    if (N === 50 && S.stairs.open < 100) { S.stairs.open = 100; unlock = '100계단이 열렸어요!'; } else if (N === 100 && S.stairs.open < 200) { S.stairs.open = 200; unlock = '200계단이 열렸어요!'; }
    addCoins(N/10); gameDone(true); setTimeout(() => result(true, unlock, !best || el <= S.stairs.best[N]), 500); }
  function result(ok, unlock, record){
    cancelAnimationFrame(raf);
    body.innerHTML = `<div class="center"><div class="big">${ok ? el.toFixed(2) + '초' : i + '칸'}</div><div class="qtext">${ok ? (record ? '새 기록이에요!' : '완주 성공!') : '앗, 미끄러졌어요!'}</div>
      ${ok ? `<p class="sub">동전 +${N/10}${unlock ? ' · ' + unlock : ''}</p>` : `<p class="sub">${N}칸 중 ${i}칸까지 올랐어요.</p>`}
      <div class="row" style="width:100%">${backToArcadeBtn()}<button class="gbtn pink" id="again">다시 하기</button></div></div>`;
    bindBack(); $('again').onclick = () => stairsGame(N);
  }
  const lk = S.look;
  function frame(){
    if (state === 'run') el = (performance.now() - t0)/1000;
    $('stN') && ($('stN').textContent = `${Math.min(i,N)} / ${N}`); $('stT') && ($('stT').textContent = el.toFixed(1) + '초');
    const sky = g.createLinearGradient(0,0,0,380); const k = Math.min(1, i/N); sky.addColorStop(0, k > .6 ? '#3b3a78' : '#8fd0ff'); sky.addColorStop(1, k > .6 ? '#a58be0' : '#d7f0ff');
    g.fillStyle = sky; g.fillRect(0,0,320,380);
    g.fillStyle = 'rgba(255,255,255,.7)'; for (let s = 0; s < 6; s++) { const yy = ((s*73 + i*14) % 400) - 20; g.fillRect((s*97)%300, yy, 22, 6); g.fillRect((s*97)%300+6, yy-4, 12, 4); }
    if (state === 'dead') fallY += 6;
    const px = 160, py = 300;
    for (let k2 = Math.max(0, i-4); k2 <= Math.min(steps.length-1, i+11); k2++){
      const x = px + (steps[k2] - steps[i])*44 - 22, y = py + (i - k2)*30;
      g.fillStyle = E; g.fillRect(x-2, y-2, 48, 16); g.fillStyle = k2 === N ? '#ffd36b' : k2 % 10 === 0 ? '#ff8fab' : '#c98b54'; g.fillRect(x, y, 44, 12); g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(x, y, 44, 3);
      if (k2 === N) { g.fillStyle = E; g.fillRect(x+20, y-30, 3, 30); g.fillStyle = '#ff5c7a'; g.fillRect(x+23, y-30, 14, 10); }
    }
    const spr = charSpr(lk, face < 0 ? 'left' : 'right', state === 'run' ? (i % 2 ? 1 : 2) : 0);
    g.drawImage(spr, px - 16, py - 44 + fallY, 32, 44);
    if (state === 'ready') { g.fillStyle = 'rgba(59,42,54,.8)'; g.fillRect(40, 140, 240, 44); g.fillStyle = '#fff'; g.font = '20px Jua'; g.textAlign = 'center'; g.fillText('버튼을 누르면 시작!', 160, 169); }
    raf = requestAnimationFrame(frame);
  }
  frame();
}

/* ---------- 실시간 대결 공통 ---------- */
let net = null;
function leaveNet(){ if (!net) return; const n = net; net = null; n.unsubs.forEach(u => { try { u(); } catch(e){} }); n.nr.leave().catch(() => {}); if (n.isHost && lobby) lobby.presence({hz:null}).catch(() => {}); }
async function hostNet(g){
  if (!lobby) { toast('친구 대결은 함께 놀기가 켜져 있을 때만 돼요. 컴퓨터와 해 보세요!'); return; }
  const name = g + '-' + Math.random().toString(36).slice(2, 9);
  startNet(g, name, true);
}
function joinNet(g, name){ if (!lobby) return; startNet(g, name, false); }
async function startNet(g, name, isHost){
  leaveNet();
  const title = g === 'rps' ? '가위바위보' : '오목';
  const body = openPanel(`${title} · 친구 대결`, g === 'rps' ? IC.fist : IC.stones, {narrow: g === 'rps', onClose: leaveNet});
  body.innerHTML = `<div class="center"><div class="qtext">${isHost ? '친구를 기다리는 중…' : '방에 들어가는 중…'}</div><p class="sub">${isHost ? '친구가 오락실에서 «빠른 참가»나 열린 방의 «참가»를 누르면 시작해요.' : ''}</p>${backToArcadeBtn()}</div>`;
  bindBack();
  let nr; try { nr = await lobby.join(name); } catch(e) { body.innerHTML = `<div class="center"><div class="qtext">방에 들어가지 못했어요</div><p class="sub">잠시 뒤 다시 해 보세요.</p>${backToArcadeBtn()}</div>`; bindBack(); return; }
  const ctxN = {g, nr, isHost, opp:null, started:false, unsubs:[], handlers:{}};
  net = ctxN;
  nr.presence({n:S.nick, role:isHost ? 'host' : 'guest', lk:S.look}).catch(() => {});
  if (isHost) lobby.presence({hz:{g, r:name}}).catch(() => {});
  ctxN.unsubs.push(nr.on('move', m => { if (m.sameTab || !ctxN.opp || m.peer !== ctxN.opp.peer) return; ctxN.handlers.move && ctxN.handlers.move(m.data || {}); }));
  ctxN.unsubs.push(nr.on('again', m => { if (m.sameTab || !ctxN.opp || m.peer !== ctxN.opp.peer) return; ctxN.handlers.again && ctxN.handlers.again(); }));
  let waitT = isHost ? null : setTimeout(() => { if (!ctxN.started && net === ctxN) { body.innerHTML = `<div class="center"><div class="qtext">방장이 보이지 않아요</div><p class="sub">이미 끝난 방일 수 있어요.</p>${backToArcadeBtn()}</div>`; bindBack(); leaveNet(); } }, 6000);
  ctxN.unsubs.push(nr.onPeers(ch => {
    if (net !== ctxN) return;
    const ppl = ch.peers.filter(p => !p.sameTab && p.kind === 'viewer' && p.presence && (p.presence.role === 'host' || p.presence.role === 'guest'));
    if (!ctxN.started) {
      if (isHost) { const gp = ppl.find(p => p.presence.role === 'guest'); if (gp) begin(gp); }
      else { const hp = ppl.find(p => p.presence.role === 'host'), others2 = ppl.filter(p => p.presence.role === 'guest');
        if (hp && others2.length) { body.innerHTML = `<div class="center"><div class="qtext">방이 꽉 찼어요</div>${backToArcadeBtn()}</div>`; bindBack(); clearTimeout(waitT); leaveNet(); }
        else if (hp) { clearTimeout(waitT); begin(hp); } }
    } else if (!ppl.some(p => p.peer === ctxN.opp.peer)) { ctxN.handlers.left && ctxN.handlers.left(); }
  }));
  function begin(p){
    ctxN.started = true; ctxN.opp = p; ctxN.oppName = String(p.presence.n || '친구').slice(0,10);
    if (isHost) lobby.presence({hz:null}).catch(() => {});
    const send = (topic, data) => nr.emit(topic, data).catch(e => { if (e && e.code === 'not_permitted') toast('신호를 보내지 못했어요.'); });
    if (g === 'rps') rpsGame({ctx:ctxN, send, body}); else omokGame({ctx:ctxN, send, body});
  }
}

/* ---------- 가위바위보 ---------- */
const HANDS = {r:['✊','바위'], s:['✌️','가위'], p:['🖐️','보']};
const beats = (a,b) => (a==='r'&&b==='s') || (a==='s'&&b==='p') || (a==='p'&&b==='r');
function rpsGame(nt){
  const body = nt ? nt.body : openPanel('가위바위보 · 컴퓨터', IC.fist, {narrow:true});
  const oppName = nt ? nt.ctx.oppName : '컴퓨터';
  let round = 1, my = 0, op = 0, picks = {}, over = false, againMe = false, againOpp = false, revealing = false, last = null;
  const render = () => {
    const p = picks[round] || {};
    body.innerHTML = `<div class="vs"><span>${esc(S.nick)}</span><span class="sc">${my} : ${op}</span><span id="opN"></span></div>
      <div class="reveal">${last ? `<span><b>${HANDS[last.me][0]}</b>나</span><span><b>${HANDS[last.op][0]}</b>상대</span>` : '<span class="sub">손을 골라요!</span>'}</div>
      <div class="qtext" style="text-align:center">${over ? (my > op ? '승리! 🎉' : '아쉽게 졌어요') : last ? last.msg : `${round}번째 판`}</div>
      ${over ? `<div class="row">${backToArcadeBtn()}<button class="gbtn pink" id="rAgain">${nt ? (againMe ? '상대를 기다리는 중…' : '한 판 더') : '한 판 더'}</button></div>`
        : `<div class="hands">${Object.entries(HANDS).map(([k,[e,n]]) => `<button class="gbtn ${p.me===k?'on':''}" data-h="${k}" ${p.me||revealing?'disabled':''}>${e}<small>${n}</small></button>`).join('')}</div>
           <p class="sub" style="text-align:center">${p.me ? (nt ? '상대가 고르는 중…' : '') : ''}</p>`}`;
    $('opN').textContent = oppName;
    body.querySelectorAll('[data-h]').forEach(b => b.onclick = () => pick(b.dataset.h));
    const ag = $('rAgain'); if (ag) ag.onclick = () => { if (!nt) return rpsGame(null); if (againMe) return; againMe = true; nt.send('again', {}); if (againOpp) restart(); else render(); };
    bindBack();

const SZ = 13;

  const score = (i, color) => { const x = i % SZ, y = Math.floor(i / SZ); let tot = 0;
    for (const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]) { let n = 1, open = 0;
      for (const s of [1,-1]) { let k = 1; while (true) { const nx = x+dx*k*s, ny = y+dy*k*s; if (nx<0||ny<0||nx>=SZ||ny>=SZ) break; const v = b[ny*SZ+nx]; if (v === color) { n++; k++; continue; } if (v === 0) open++; break; } }
      tot += n >= 5 ? 100000 : n === 4 ? (open === 2 ? 20000 : open ? 3000 : 0) : n === 3 ? (open === 2 ? 2000 : open ? 200 : 0) : n === 2 ? (open === 2 ? 100 : open ? 20 : 0) : open; }
    return tot; };
  const aiMove = () => { let best = -1, bi = -1;
    for (let i = 0; i < b.length; i++) { if (b[i]) continue; const x = i % SZ, y = Math.floor(i/SZ); let near = false;
      for (let dy = -2; dy <= 2 && !near; dy++) for (let dx = -2; dx <= 2; dx++) { const nx = x+dx, ny = y+dy; if (nx>=0&&ny>=0&&nx<SZ&&ny<SZ&&b[ny*SZ+nx]) { near = true; break; } }
      if (!near) continue; const s = score(i, opColor)*1.1 + score(i, myColor) + Math.random(); if (s > best) { best = s; bi = i; } }
    return bi < 0 ? Math.floor(SZ*SZ/2) : bi; };
  const place = (i, color) => { if (over || b[i] || turn !== color) return false; b[i] = color; lastI = i; moves++;
    if (line(i, color)) { over = color; gameDone(color === myColor); if (color === myColor) addCoins(nt ? 10 : 5); }
    else if (moves >= SZ*SZ) over = 3;
    else turn = 3 - turn; render(); return true; };
  const render = () => {

    const ag = $('oAgain'); if (ag) ag.onclick = () => { if (!nt) return omokGame(null); if (againMe) return; againMe = true; nt.send('again', {}); if (againOpp) restart(); else render(); };
    bindBack();
  };
  const restart = () => { b = new Array(SZ*SZ).fill(0); turn = 1; over = 0; lastI = -1; againMe = false; againOpp = false; moves = 0; render(); };
  if (nt) {

function slideSolve(board, N){
  // A* 탐색 (맨해튼 거리). 3×3 전용. 반환: {moves:[움직일 타일 번호…], seen:확인한 상태 수}

  const heap = [], push = n => { heap.push(n); let i = heap.length - 1; while (i) { const p = (i - 1) >> 1; if (heap[p].f <= heap[i].f) break; [heap[p], heap[i]] = [heap[i], heap[p]]; i = p; } };
  const pop = () => { const top = heap[0], last = heap.pop(); if (heap.length) { heap[0] = last; let i = 0; for (;;) { const l = i * 2 + 1, r = l + 1; let m = i; if (l < heap.length && heap[l].f < heap[m].f) m = l; if (r < heap.length && heap[r].f < heap[m].f) m = r; if (m === i) break; [heap[m], heap[i]] = [heap[i], heap[m]]; i = m; } } return top; };
  const startKey = board.join(','), best = new Map([[startKey, 0]]), parent = new Map();
  push({b:board.slice(), g:0, f:hOf(board), k:startKey});
  let seen = 0;
  while (heap.length) {
    const cur = pop(); seen++;
    if (cur.k === goalKey) { const moves = []; let k = cur.k; while (parent.has(k)) { const [pk, t] = parent.get(k); moves.push(t); k = pk; } return {moves:moves.reverse(), seen}; }
    if (cur.g > best.get(cur.k)) continue;
    if (seen > 400000) break;
    const z = cur.b.indexOf(0), zx = z % N, zy = z / N | 0;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const x = zx + dx, y = zy + dy; if (x < 0 || y < 0 || x >= N || y >= N) continue;
      const j = y * N + x, nb = cur.b.slice(); nb[z] = nb[j]; nb[j] = 0;

      best.set(k, g); parent.set(k, [cur.k, cur.b[j]]); push({b:nb, g, f:g + hOf(nb), k});
    }

      if (v.length < tgt.length * .8) { toast('문장을 끝까지 쳐 주세요'); return; }
      for (let j = 0; j < tgt.length; j++) if (v[j] !== tgt[j]) errs++; errs += Math.max(0, v.length - tgt.length); chars += tgt.length; k++;
      if (k >= list.length) done(); else render(); };
  };
  const paint = v => { const tgt = list[k]; $('tyT').innerHTML = [...tgt].map((ch,j) => j < v.length ? `<span class="${v[j]===ch?'c':'w'}">${esc(ch)}</span>` : `<span class="r">${esc(ch)}</span>`).join(''); };
  const done = () => { const min = (performance.now()-t0)/60000, spd = Math.round(chars / Math.max(min,.01)), acc = Math.max(0, Math.round((1 - errs/chars)*100)), reward = 3 + Math.floor(acc/25);
    addCoins(reward); gameDone(acc >= 90);
    body.innerHTML = `<div class="center"><div class="big">${spd}<span style="font-size:20px"> 글자/분</span></div><div class="qtext">정확도 ${acc}%</div><p class="sub">동전 +${reward}</p>
      <div class="row" style="width:100%">${backToArcadeBtn()}<button class="gbtn pink" id="tyAg">다시 하기</button></div></div>`;
    bindBack(); $('tyAg').onclick = () => typingGame(lang); };
  render();
}

/* ================= 교사용 화면 ================= */
let tTimer = null, tCode = '', teacherRows = [], delPending = null;
function teacherHead(){ return `<div class="row" style="align-items:center"><h1 style="flex:3">교사용 화면</h1><button class="gbtn" id="tBack" style="flex:none;width:auto;padding-inline:18px">← 처음으로</button></div>`; }
function bindTBack(){ $('tBack').onclick = () => { clearInterval(tTimer); tTimer = null; showStart(); }; }
function openTeacher(){
  $('start').hidden = true; $('game').hidden = true; $('teacher').hidden = false;
  const tb = $('tBody');
  if (!API.ok) { tb.innerHTML = teacherHead() + `<div class="note">교사용 화면은 구글 스프레드시트를 연결한 뒤에 쓸 수 있어요. 프로젝트의 README에 있는 설정 방법을 따라 주세요.</div>`; bindTBack(); return; }
  tb.innerHTML = teacherHead() + `<form class="form" id="tf" style="max-width:420px"><label class="field">선생님 코드<input id="tCode" type="password" autocomplete="off"></label><div class="err" id="tErr"></div><button class="gbtn pink">확인</button>
    <p class="sub">선생님 코드는 Apps Script(Code.gs) 맨 위 TEACHER_CODE 에 정한 값이에요.</p></form>`;
  bindTBack();
  $('tf').onsubmit = async e => { e.preventDefault(); tCode = $('tCode').value.trim();
    try { teacherRows = await API.teacherList(tCode); } catch(x) { $('tErr').textContent = /bad_code/.test(x && x.message || '') ? '코드가 맞지 않아요.' : '서버에 연결하지 못했어요.'; return; }
    tb.innerHTML = teacherHead() + `<p class="sub">회원으로 가입한 학생의 기록이에요. 15초마다 새로 고쳐요. 같은 내용을 구글 스프레드시트 «학생 기록» 탭에서도 볼 수 있어요. 게스트 기록은 학생 기기에만 있어 여기에 나오지 않아요.</p>
      <div class="stats" id="tStats"></div><div class="tbl-wrap"><table><thead><tr><th>닉네임</th><th>레벨</th><th>푼 문제</th><th>정답률</th><th>수학</th><th>과학</th><th>국어</th><th>영어</th><th>사회</th><th>동전</th><th>마지막 접속</th><th></th></tr></thead><tbody id="tRows"></tbody></table></div>
      <div class="note">비밀번호를 잊은 학생은 여기서 기록을 지우고 같은 닉네임으로 새로 가입하게 하세요.</div>`;
    bindTBack(); renderTeacher();
    clearInterval(tTimer); tTimer = setInterval(loadTeacher, 15000);
  };
  $('tCode').focus();
}
async function loadTeacher(){ try { teacherRows = await API.teacherList(tCode); renderTeacher(); } catch(e){} }
function renderTeacher(){
  const rows = $('tRows'); if (!rows) return;
  const n = teacherRows.length, solved = teacherRows.reduce((s,r) => s + (+r.solved||0), 0), correct = teacherRows.reduce((s,r) => s + (+r.correct||0), 0);
  const day = Date.now() - 864e5, active = teacherRows.filter(r => (+r.updatedAt||0) > day).length;
  $('tStats').innerHTML = `<div class="stat"><b>${n}</b><span>회원 학생</span></div><div class="stat"><b>${active}</b><span>최근 24시간 접속</span></div><div class="stat"><b>${solved}</b><span>푼 문제 합계</span></div><div class="stat"><b>${solved ? Math.round(correct/solved*100) : 0}%</b><span>전체 정답률</span></div>`;
  if (!n) { rows.innerHTML = '<tr><td colspan="12">아직 회원 학생이 없어요. 학생이 «회원으로 놀기»로 들어오면 여기에 보여요.</td></tr>'; return; }
  rows.innerHTML = '';
  teacherRows.forEach(r => {
    const tr = document.createElement('tr'), s = +r.solved||0, c = +r.correct||0, rate = s ? Math.round(c/s*100) : null, h = r.hearts || {};
    const cells = [null, `Lv.${+r.lv||1}`, s, rate == null ? '–' : null, ...['moa','porong','daon','buddy','sol'].map(k => '♥'.repeat(clamp(+h[k]||0,0,5)) || '–'), +r.coins||0, r.updatedAt ? new Date(+r.updatedAt).toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '–'];
    cells.forEach((v,i) => { const td = document.createElement('td'); if (i===2||i===9) td.className = 'num';
      if (i === 0) { if ((+r.updatedAt||0) > Date.now() - 120000) { const d = document.createElement('span'); d.className = 'on-dot'; td.appendChild(d); } td.appendChild(document.createTextNode(String(r.nick || '?'))); }
      else if (i === 3 && rate != null) { const sp = document.createElement('span'); sp.className = 'rate ' + (rate >= 80 ? 'hi' : rate >= 50 ? 'mid' : 'lo'); sp.textContent = rate + '%'; td.appendChild(sp); }
      else { td.textContent = v; if (i >= 4 && i <= 8) td.style.color = '#e0567e'; }
      tr.appendChild(td); });
    const td = document.createElement('td'), b = document.createElement('button'); b.className = 'del';
    b.textContent = delPending === r.id ? '정말 지울까요?' : '기록 지우기';
    b.onclick = async () => { if (delPending !== r.id) { delPending = r.id; renderTeacher(); return; } delPending = null;
      try { await API.teacherDelete(tCode, r.id); toast('기록을 지웠어요'); loadTeacher(); } catch(e){ toast('지우지 못했어요. 잠시 뒤 다시 해 주세요.'); } };
    td.appendChild(b); tr.appendChild(td); rows.appendChild(tr);
  });
}

/* ================= 시작 ================= */
document.addEventListener('visibilitychange', () => { if (document.hidden) { save(); flush(); } });
addEventListener('pagehide', () => { if (who && who.kind === 'member' && !saveBlocked && S) { if (me) S.pos = {x:Math.round(me.x), y:Math.round(me.y)}; API.beacon(); } });
function boot(){ buildMap(); renderGround(); renderParade(); showStart(); }
boot();
})();
</script>
